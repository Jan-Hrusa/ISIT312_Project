# Spark in the client and nodemanager containers (SPARK_CONF_DIR=/opt/conf).
spark.sql.catalogImplementation      hive
spark.sql.warehouse.dir              hdfs://namenode:8020/user/hive/warehouse
spark.sql.session.timeZone           UTC
# The stack's Hive 3.1.3 metastore through its own client jars (copied from apache/hive:3.1.3).
spark.sql.hive.metastore.version     3.1.3
spark.sql.hive.metastore.jars        path
spark.sql.hive.metastore.jars.path   file:///opt/hive-metastore-jars/*
spark.driver.memory                  1500m
spark.ui.showConsoleProgress         false
# local[*] has no periodic resource offer: a stage mixing shuffle partitions (local to the driver) with HDFS ones
# (preferring the datanode's host) runs the local tasks, then waits for an offer that never comes and hangs.
spark.locality.wait                  0s
# SPARK_MASTER=yarn (E1, E5): one small executor fits the 2 GB NodeManager.
spark.yarn.am.memory                 512m
spark.executor.memory                512m
spark.executor.instances             1
spark.executorEnv.PYSPARK_PYTHON     python3
