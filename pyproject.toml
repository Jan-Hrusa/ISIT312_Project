[project]
name = "isit312-data-lake"
version = "0.1.0"
description = "Data lake for a Czech solar-farm construction company (ISIT312 group project)"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
